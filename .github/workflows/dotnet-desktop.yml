name: Build PRJ2-Extractor

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PROJECT_PATH: "PRJ2 Extractor/PRJ2 Extractor.csproj"
      SOLUTION_PATH: "PRJ2 Extractor.slnx"
      OUTPUT_DIR: "publish"
      ZIP_NAME: "PRJ2-Extractor.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$env:SOLUTION_PATH" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$env:SOLUTION_PATH" --configuration Release --no-build

      - name: Publish app
        run: dotnet publish "$env:PROJECT_PATH" --configuration Release --output "$env:OUTPUT_DIR" --no-restore

      - name: Zip publish output
        shell: pwsh
        run: |
          if (Test-Path "$env:ZIP_NAME") { Remove-Item "$env:ZIP_NAME" -Force }
          Compress-Archive -Path "$env:OUTPUT_DIR/*" -DestinationPath "$env:ZIP_NAME" -Force

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRJ2-Extractor
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          compression-level: 0

      - name: Update prj2 tag and release asset
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag --force prj2 $env:GITHUB_SHA
          git push --force origin refs/tags/prj2

          gh release view prj2 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create prj2 "$env:ZIP_NAME" `
              --title "PRJ2-Extractor" `
              --notes "Automated build from commit $env:GITHUB_SHA" `
              --target $env:GITHUB_SHA
          }
          else {
            gh release upload prj2 "$env:ZIP_NAME" --clobber
          }
